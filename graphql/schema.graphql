"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    user(
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    users(
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    Tipo_Usuario(
        id_usuario: ID
    ): Tipo_Usuario @find

    allUsers:[User!]! @all
}

type Tipo_Usuario {
    id: ID!
    id_usuario: Int
    usuario: User
    Nombre_Tipo_Usuario: String
    Etiqueta: Int
    created_at: DateTime
    updated_at: DateTime
}

"Account of a person who utilizes this application."
type User {
    id: ID!

    name: String!

    email: String!

    Apellido_Paterno: String!

    Apellido_Materno: String!

    Age: String!

    Telefono: String!

    Direccion: String!

    Ciudad: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

type Mutation{
    createUser(
        name: String!
        Apellido_Paterno: String!
        Apellido_Materno: String!
        Age: String!
        Telefono: String!
        Direccion: String!
        Ciudad: String!
        email: String!
        password: String!
    ): User @create

    asignUserType(
        id_usuario: Int!
        Nombre_Tipo_Usuario: String!
        Etiqueta: Int!
    ): Tipo_Usuario @create

    updateUser(
        id: int!
        name: String
    ): User
updateU(input: UpdatePostInput!): UpdatePostPayload
}

input UpdatePostInput {
	filter: PostFilter!
	set: PostPatch
	remove: PostPatch
}

type UpdatePostPayload {
	post(filter: PostFilter, order: PostOrder, first: Int, offset: Int): [User]
	numUids: Int
}
